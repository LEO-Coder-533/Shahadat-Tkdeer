<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منشئ شهادات التقدير - الأقصر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#102746;--gold:#d6a64b;--paper:#f5e5c5}
*{box-sizing:border-box}
body{margin:0;background:#e9d8b7;color:#2c251b;font-family:Cairo,Arial,sans-serif}
header{background:linear-gradient(110deg,#0b1d35,#17385e);color:#f3c46b;padding:14px 24px;border-bottom:4px solid #c99a43}
header h1{margin:0;font-size:clamp(20px,3vw,30px)}
header p{margin:2px 0 0;color:#f8e8c8;font-size:13px}
.layout{max-width:1500px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:350px minmax(0,1fr);gap:18px;align-items:start}
.panel{background:#fff9ed;border:1px solid #c8a36c;border-radius:15px;overflow:hidden;box-shadow:0 8px 24px #5b3e1c20}
.panel h2{font-size:18px;text-align:center;margin:0;padding:12px;background:linear-gradient(110deg,#f6d58f,#e4ae50);color:#302313}
.form{padding:17px;display:grid;gap:11px}
label{font-size:13px;font-weight:800;display:block;margin-bottom:4px}
input,textarea{width:100%;border:1px solid #bda174;border-radius:9px;padding:10px 11px;font:inherit;font-size:13px;background:#fffdf8;outline:none}
input:focus,textarea:focus{border-color:#a87522;box-shadow:0 0 0 3px #d5a64b30}
textarea{resize:vertical;min-height:65px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{font:inherit;font-weight:800;border:0;border-radius:9px;padding:11px 14px;cursor:pointer}
button:hover{filter:brightness(1.05);transform:translateY(-1px)}
.create{background:#102d50;color:white;width:100%;margin-top:4px}
.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:12px}
.actions button{flex:1;min-width:120px;color:white}
.png{background:#21834b}.print{background:#1262a8}.reset{background:#71328c}
.hint{font-size:11px;color:#78664b;line-height:1.7}
.preview{padding:14px;background:#f7ecd5}
.paper{width:100%;aspect-ratio:4/3;position:relative;overflow:hidden;background:#f5e5c5}
.paper img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
.overlay{position:absolute;inset:0;color:#302719;text-align:center}
.txt{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;padding:0 5px}
.intro{top:24.8%;left:27%;width:68%;height:12%;font-size:clamp(12px,1.55vw,22px);line-height:1.75}
.salutation{top:36.2%;left:43%;width:27%;height:6%;color:#b72e39;font-family:'Amiri', serif;font-weight:700;font-size:clamp(17px,2.1vw,29px)}
.recipient{top:45.3%;left:29%;width:51%;height:9%;font-family:'Amiri', serif;font-weight:700;color:#153b70;font-size:clamp(23px,3.2vw,44px)}
.reason{top:57%;left:31%;width:48%;height:6.3%;font-size:clamp(14px,1.8vw,25px)}
.program{top:62.5%;left:34%;width:45%;height:7%;font-family:'Amiri', serif;font-weight:700;color:#d21f24;font-size:clamp(20px,2.65vw,36px)}
.approver{top:68.8%;left:28%;width:26%;height:6%;font-size:clamp(13px,1.6vw,22px)}
.organizer{top:68.8%;left:60%;width:31%;height:9%;font-size:clamp(13px,1.6vw,22px)}
.date{top:78%;left:36%;width:43%;height:4%;font-size:clamp(10px,1.1vw,15px);color:#6e542f}
.status{text-align:center;color:#675438;font-size:12px;min-height:20px;padding:0 10px 10px}
<footer>معًا نحتفي بالتميز ♥ · الأقصر</footer>
@media(max-width:900px){.layout{grid-template-columns:1fr}.preview{overflow-x:auto}.paper{min-width:570px}}
@media print{
 @page{size:A4 landscape;margin:0}
 html,body{width:297mm;height:210mm;margin:0!important;padding:0!important;background:#fff!important;font-family:'Cairo',Arial,sans-serif!important}
 body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 header,.form-panel,.preview-heading,.actions,.status,footer{display:none!important}
 .layout{display:block;width:297mm;height:210mm;max-width:none;margin:0;padding:0}
 .preview-panel{width:297mm;height:210mm;border:0;border-radius:0;box-shadow:none;overflow:hidden}
 .preview{width:297mm;height:210mm;padding:0;background:white}
 .paper{width:297mm;height:210mm;aspect-ratio:auto}
 /* تثبيت مقاسات وأخطاء الطباعة للخطوط لتطابق المعاينة تماماً */
 .txt { font-size: 20mm !important; }
 .salutation { font-family: 'Amiri', serif !important; font-weight: 700 !important; color: #b72e39 !important; font-size: 7mm !important; }
 .recipient { font-family: 'Amiri', serif !important; font-weight: 700 !important; color: #153b70 !important; font-size: 11mm !important; }
 .program { font-family: 'Amiri', serif !important; font-weight: 700 !important; color: #d21f24 !important; font-size: 9mm !important; }
 .intro { font-size: 5mm !important; }
 .reason { font-size: 5.5mm !important; }
 .approver, .organizer { font-size: 5mm !important; }
 .date { font-size: 3.5mm !important; color: #6e542f !important; }
}
</style>
</head>
<body>
<header><h1>𓂀 شهادات التقدير - الأقصر</h1><p>قالب الشهادة الأصلي مع بيانات قابلة للتعديل</p></header>
<main class="layout">
<section class="panel form-panel">
<h2>✎ بيانات الشهادة</h2>
<div class="form">
<div><label for="introInput">نص التقديم</label><textarea id="introInput">تتقدم وحدة السكان بديوان عام محافظة الأقصر ومركز حياة للاستشارات والتدريب بالشكر والتقدير</textarea></div>
<div><label for="salutationInput">عبارة المخاطبة</label><input id="salutationInput" value="للسيد / ـ"></div>
<div><label for="nameInput">اسم الشخص المكرَّم</label><input id="nameInput" value="محمد أحمد عبد المحسن" placeholder="اكتب الاسم هنا"></div>
<div><label for="reasonInput">سبب التكريم</label><input id="reasonInput" value="على اجتيازه البرنامج التدريبي"></div>
<div><label for="programInput">اسم البرنامج أو المناسبة</label><input id="programInput" value="إعداد قادة الغد"></div>
<div class="grid2">
 <div><label for="approverInput">جهة الاعتماد</label><input id="approverInput" value="يعتمد محافظ الأقصر"></div>
 <div><label for="organizerInput">الجهة / التوقيع</label><input id="organizerInput" value="مركز حياة للاستشارات والتدريب"></div>
</div>
<div><label for="dateInput">تاريخ الإصدار (اختياري)</label><input id="dateInput" type="date"></div>
<button class="create" id="updateBtn">تحديث الشهادة ✨</button>
<div class="hint">الشعاران والإطار والزخارف مأخوذة من صورة الشهادة الأصلية. يمكنك تعديل النصوص من هنا، ثم تحميل الشهادة أو طباعتها.</div>
</div>
</section>
<section class="panel preview-panel">
<h2 class="preview-heading">◉ معاينة الشهادة الأصلية</h2>
<div class="preview">
<div class="paper" id="certificate">
<img src="certificate-template-clean.png" alt="قالب شهادة التقدير الأصلي">
<div class="overlay">
<div class="txt intro" id="outIntro"></div>
<div class="txt salutation" id="outSalutation"></div>
<div class="txt recipient" id="outName"></div>
<div class="txt reason" id="outReason"></div>
<div class="txt program" id="outProgram"></div>
<div class="txt approver" id="outApprover"></div>
<div class="txt organizer" id="outOrganizer"></div>
<div class="txt date" id="outDate"></div>
</div>
</div>
</div>
<div class="actions">
<button class="png" id="downloadBtn">⬇ تحميل PNG</button>
<button class="print" id="printBtn">▣ طباعة / PDF</button>
<button class="reset" id="resetBtn">↻ إعادة تعيين</button>
</div>
<div class="status" id="status" aria-live="polite">المعاينة تتحدث تلقائيًا أثناء الكتابة.</div>
</section>
</main>
<footer>معًا نحتفي بالتميز ♥ · الأقصر</footer>
<script>
const $=id=>document.getElementById(id);
const pairs={
 introInput:'outIntro',salutationInput:'outSalutation',nameInput:'outName',
 reasonInput:'outReason',programInput:'outProgram',approverInput:'outApprover',
 organizerInput:'outOrganizer'
};
function update(){
 for(const [input,out] of Object.entries(pairs)) $(out).textContent=$(input).value.trim();
 const d=$('dateInput').value;
 $('outDate').textContent=d?'تاريخ الإصدار: '+new Date(d+'T00:00:00').toLocaleDateString('ar-EG'):'';
}
Object.keys(pairs).concat('dateInput').forEach(id=>$(id).addEventListener('input',update));
$('updateBtn').addEventListener('click',()=>{update();$('status').textContent='تم تحديث بيانات الشهادة.';});
$('printBtn').addEventListener('click',()=>window.print());
function wrapCanvasText(ctx,text,maxWidth){
 const words=String(text||'').trim().split(/\s+/).filter(Boolean);
 const lines=[];let line='';
 for(const word of words){
  const test=line?line+' '+word:word;
  if(ctx.measureText(test).width>maxWidth && line){lines.push(line);line=word;}
  else line=test;
 }
 if(line)lines.push(line);
 return lines.length?lines:[''];
}
function drawTextBlock(ctx,text,box,opts){
 const {x,y,w,h,font,color='#302719',weight='400',family='Cairo, Arial, sans-serif',lineHeight=1.35}=opts;
 ctx.save();
 ctx.direction='rtl';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillStyle=color;ctx.font=weight+' '+font+'px "'+family+'"';
 const lines=wrapCanvasText(ctx,text,w);
 const maxLines=Math.max(1,Math.floor(h/(font*lineHeight)));
 const shown=lines.slice(0,maxLines);
 const total=shown.length*font*lineHeight;
 let yy=y+(h-total)/2+font*lineHeight/2;
 shown.forEach(line=>{ctx.fillText(line,x,yy,w);yy+=font*lineHeight;});
 ctx.restore();
}
$('downloadBtn').addEventListener('click',async()=>{
 update();
 $('status').textContent='جارٍ تجهيز صورة الشهادة بجودة عالية...';
 try{
  if(document.fonts && document.fonts.ready) await document.fonts.ready;
  const source=$('certificate').querySelector('img');
  if(!source || !source.complete || !source.naturalWidth) throw new Error('template image is not ready');
  const canvas=document.createElement('canvas');
  canvas.width=3508;canvas.height=2480; // A4 landscape at approximately 300 DPI
  const ctx=canvas.getContext('2d');
  if(!ctx) throw new Error('canvas context unavailable');
  ctx.fillStyle='#f5e5c5';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(source,0,0,canvas.width,canvas.height);
  const W=canvas.width,H=canvas.height;
  const block=(id, left, top, width, height, size, color, weight='400', family='Cairo, Arial, sans-serif', lineHeight=1.4)=>{
   drawTextBlock(ctx,$(id).textContent,{x:(left+width/2)*W/100,y:(top+height/2)*H/100,w:width*W/100,h:height*H/100},
    {x:(left+width/2)*W/100,y:(top+height/2)*H/100,w:width*W/100,h:height*H/100,
     font:size*W/1448,color,weight,family,lineHeight});
  };
  block('outIntro',27,24.8,68,12,22,'#302719','400','Cairo, Arial, sans-serif',1.65);
  block('outSalutation',43,36.2,27,6,29,'#b72e39','700','Amiri',1.25);
  block('outName',29,45.3,51,9,44,'#153b70','700','Amiri',1.2);
  block('outReason',31,57,48,6.3,25,'#302719','400','Cairo, Arial, sans-serif',1.3);
  block('outProgram',34,62.5,45,7,36,'#d21f24','700','Amiri',1.2);
  block('outApprover',28,68.8,26,6,22,'#302719','400','Cairo, Arial, sans-serif',1.3);
  block('outOrganizer',60,68.8,31,9,22,'#302719','400','Cairo, Arial, sans-serif',1.3);
  block('outDate',36,78,43,4,15,'#6e542f','400','Cairo, Arial, sans-serif',1.2);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob) throw new Error('PNG encoding failed');
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='شهادة-تقدير-A4.png';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  $('status').textContent='تم إنشاء صورة PNG بجودة عالية (A4 أفقي).';
 }catch(e){
  console.error(e);
  $('status').textContent='فشل التصدير: تأكد من فتح الموقع عبر Chrome وانتظار ظهور صورة القالب، ثم أعد المحاولة.';
 }
});
$('resetBtn').addEventListener('click',()=>{
 if(!confirm('إعادة النصوص إلى القيم الافتراضية؟'))return;
 $('introInput').value='تتقدم وحدة السكان بديوان عام محافظة الأقصر ومركز حياة للاستشارات والتدريب بالشكر والتقدير';
 $('salutationInput').value='للسيد / ـ';$('nameInput').value='محمد أحمد عبد المحسن';
 $('reasonInput').value='على اجتيازه البرنامج التدريبي';$('programInput').value='إعداد قادة الغد';
 $('approverInput').value='يعتمد محافظ الأقصر';$('organizerInput').value='مركز حياة للاستشارات والتدريب';$('dateInput').value='';
 update();$('status').textContent='تمت إعادة البيانات الافتراضية.';
});
update();
</script>
</body>
</html>
